openapi: 3.1.0
info:
  title: PKI-Console API
  version: 0.1.0
  description: Authenticated enterprise PKI management and public certificate-status APIs.
servers:
  - url: https://pki-console.example.com/api/v1
    description: Console API
  - url: https://pki.example.com
    description: Public PKI publication service
tags:
  - name: Authentication
  - name: Users
  - name: Certificate Authorities
  - name: Certificate Requests
  - name: Certificates
  - name: Signing Profiles
  - name: Audit
  - name: Utilities
  - name: Operations
  - name: Public PKI
paths:
  /auth/login:
    post:
      tags: [Authentication]
      operationId: login
      security: []
      parameters:
        - $ref: '#/components/parameters/CFAccessEmail'
        - $ref: '#/components/parameters/CFAccessJWT'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Authenticated. The response also sets the secure session cookie.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '401': { $ref: '#/components/responses/Problem' }
  /auth/logout:
    post:
      tags: [Authentication]
      operationId: logout
      responses:
        '204': { description: Session revoked }
        '401': { $ref: '#/components/responses/Problem' }
  /auth/session:
    get:
      tags: [Authentication]
      operationId: currentSession
      responses:
        '200':
          description: Current authenticated user
          content:
            application/json:
              schema:
                type: object
                required: [user]
                properties:
                  user: { $ref: '#/components/schemas/User' }
        '401': { $ref: '#/components/responses/Problem' }
  /users:
    get:
      tags: [Users]
      operationId: listUsers
      responses:
        '200':
          description: Users
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/User' } }
        '403': { $ref: '#/components/responses/Problem' }
    post:
      tags: [Users]
      operationId: createUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, role, password]
              properties:
                username: { type: string, minLength: 3, maxLength: 128 }
                email: { type: [string, 'null'], format: email }
                role: { type: string, enum: [operator, user] }
                password: { type: string, minLength: 15, maxLength: 128, writeOnly: true }
      responses:
        '201':
          description: User created
          content: { application/json: { schema: { $ref: '#/components/schemas/User' } } }
        '403': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
  /users/{id}/status:
    patch:
      tags: [Users]
      operationId: setUserStatus
      parameters:
        - $ref: '#/components/parameters/ID'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { type: string, enum: [active, disabled] }
      responses:
        '204': { description: User status updated; disabling revokes active sessions }
        '403': { $ref: '#/components/responses/Problem' }
  /users/{id}/password:
    put:
      tags: [Users]
      operationId: resetUserPassword
      parameters:
        - $ref: '#/components/parameters/ID'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password]
              properties:
                password: { type: string, minLength: 15, maxLength: 128, writeOnly: true }
      responses:
        '204': { description: Password replaced and all existing sessions revoked }
        '404': { $ref: '#/components/responses/Problem' }
  /cas:
    get:
      tags: [Certificate Authorities]
      operationId: listCAs
      responses:
        '200':
          description: Certificate authorities
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/CertificateAuthority' } }
  /cas/roots:
    post:
      tags: [Certificate Authorities]
      operationId: createRootCA
      requestBody: { $ref: '#/components/requestBodies/CreateCA' }
      responses:
        '201':
          description: Root CA created
          content: { application/json: { schema: { $ref: '#/components/schemas/CertificateAuthority' } } }
        '403': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /cas/intermediates:
    post:
      tags: [Certificate Authorities]
      operationId: createIntermediateCA
      requestBody: { $ref: '#/components/requestBodies/CreateCA' }
      responses:
        '201':
          description: Intermediate CA created
          content: { application/json: { schema: { $ref: '#/components/schemas/CertificateAuthority' } } }
        '403': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /cas/{id}:
    get:
      tags: [Certificate Authorities]
      operationId: getCA
      parameters: [{ $ref: '#/components/parameters/ID' }]
      responses:
        '200':
          description: Certificate authority
          content: { application/json: { schema: { $ref: '#/components/schemas/CertificateAuthority' } } }
        '404': { $ref: '#/components/responses/Problem' }
  /cas/{id}/grants:
    get:
      tags: [Certificate Authorities]
      operationId: listCAGrants
      parameters: [{ $ref: '#/components/parameters/ID' }]
      responses:
        '200': { description: Operator grants on this intermediate CA }
        '403': { $ref: '#/components/responses/Problem' }
    post:
      tags: [Certificate Authorities]
      operationId: createCAGrant
      parameters:
        - $ref: '#/components/parameters/ID'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [user_id, permission]
              properties:
                user_id: { type: string, format: uuid }
                permission: { type: string, enum: [view_requests, approve, issue, revoke] }
      responses:
        '204': { description: Grant created }
        '422': { $ref: '#/components/responses/Problem' }
  /cas/{id}/grants/{userID}/{permission}:
    delete:
      tags: [Certificate Authorities]
      operationId: deleteCAGrant
      parameters:
        - $ref: '#/components/parameters/ID'
        - { name: userID, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: permission, in: path, required: true, schema: { type: string } }
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '204': { description: Grant revoked }
        '404': { $ref: '#/components/responses/Problem' }
  /cas/{id}/profiles:
    get:
      tags: [Signing Profiles]
      operationId: listSigningProfiles
      parameters: [{ $ref: '#/components/parameters/ID' }]
      responses:
        '200':
          description: Signing profiles
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/SigningProfile' } }
    post:
      tags: [Signing Profiles]
      operationId: createSigningProfile
      parameters:
        - $ref: '#/components/parameters/ID'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody: { $ref: '#/components/requestBodies/SigningProfile' }
      responses:
        '201':
          description: Signing profile created
          content: { application/json: { schema: { $ref: '#/components/schemas/SigningProfile' } } }
        '422': { $ref: '#/components/responses/Problem' }
  /cas/{id}/profiles/{profileID}:
    put:
      tags: [Signing Profiles]
      operationId: updateSigningProfile
      parameters:
        - $ref: '#/components/parameters/ID'
        - { name: profileID, in: path, required: true, schema: { type: string, format: uuid } }
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody: { $ref: '#/components/requestBodies/SigningProfile' }
      responses:
        '200':
          description: Signing profile updated
          content: { application/json: { schema: { $ref: '#/components/schemas/SigningProfile' } } }
    delete:
      tags: [Signing Profiles]
      operationId: deleteSigningProfile
      parameters:
        - $ref: '#/components/parameters/ID'
        - { name: profileID, in: path, required: true, schema: { type: string, format: uuid } }
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '204': { description: Non-default unreferenced profile deleted }
        '409': { $ref: '#/components/responses/Problem' }
  /cas/{id}/keys/export:
    post:
      tags: [Certificate Authorities]
      operationId: exportCAKey
      parameters: [{ $ref: '#/components/parameters/ID' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password, totp]
              properties:
                password: { type: string, writeOnly: true }
                totp: { type: string, pattern: '^[0-9]{6}$', writeOnly: true }
      responses:
        '200':
          description: PKCS#8 PEM private key; never cache this response.
          headers:
            Cache-Control: { schema: { type: string, const: 'no-store, max-age=0' } }
          content: { application/x-pem-file: { schema: { type: string } } }
        '403': { $ref: '#/components/responses/Problem' }
  /certificate-requests:
    get:
      tags: [Certificate Requests]
      operationId: listCertificateRequests
      responses:
        '200':
          description: Requests visible to the caller
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/CertificateRequest' } }
    post:
      tags: [Certificate Requests]
      operationId: createCertificateRequest
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateCertificateRequest' }
      responses:
        '201':
          description: Request submitted
          content: { application/json: { schema: { $ref: '#/components/schemas/CertificateRequest' } } }
        '422': { $ref: '#/components/responses/Problem' }
  /certificate-requests/{id}/approve:
    post:
      tags: [Certificate Requests]
      operationId: approveCertificateRequest
      parameters: [{ $ref: '#/components/parameters/ID' }]
      requestBody: { $ref: '#/components/requestBodies/Decision' }
      responses:
        '202': { description: Request queued for idempotent issuance }
        '409': { $ref: '#/components/responses/Problem' }
  /certificate-requests/{id}:
    get:
      tags: [Certificate Requests]
      operationId: getCertificateRequest
      parameters: [{ $ref: '#/components/parameters/ID' }]
      responses:
        '200':
          description: Certificate request visible to the caller
          content: { application/json: { schema: { $ref: '#/components/schemas/CertificateRequest' } } }
        '404': { $ref: '#/components/responses/Problem' }
  /certificate-requests/{id}/reject:
    post:
      tags: [Certificate Requests]
      operationId: rejectCertificateRequest
      parameters: [{ $ref: '#/components/parameters/ID' }]
      requestBody: { $ref: '#/components/requestBodies/Decision' }
      responses:
        '202': { description: Request rejected }
        '409': { $ref: '#/components/responses/Problem' }
  /certificate-inventory:
    get:
      tags: [Certificates]
      operationId: listCertificateInventory
      description: >-
        Lists certificate requests together with their resulting certificates. Super administrators see the
        entire system; operators see their own requests, decisions, and authorized CA records; ordinary users
        see only their own records.
      parameters:
        - name: status
          in: query
          required: false
          schema: { type: string, enum: [pending, issued, rejected, failed] }
          description: Workflow group. Pending includes pending, approved, and issuing requests.
      responses:
        '200':
          description: Role-filtered certificate inventory
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/CertificateInventoryItem' } }
        '400': { $ref: '#/components/responses/Problem' }
  /certificates:
    get:
      tags: [Certificates]
      operationId: listCertificates
      responses:
        '200':
          description: Certificates visible to the caller
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/Certificate' } }
  /certificates/{id}/revoke:
    post:
      tags: [Certificates]
      operationId: revokeCertificate
      parameters: [{ $ref: '#/components/parameters/ID' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: integer, minimum: 0, maximum: 10, not: { const: 7 } }
                comment: { type: string, maxLength: 2000 }
      responses:
        '200':
          description: Certificate revoked and CRL regenerated
          content: { application/json: { schema: { $ref: '#/components/schemas/Certificate' } } }
        '422': { $ref: '#/components/responses/Problem' }
  /certificates/{id}:
    get:
      tags: [Certificates]
      operationId: getCertificate
      parameters: [{ $ref: '#/components/parameters/ID' }]
      responses:
        '200': { description: Certificate visible to the caller }
        '404': { $ref: '#/components/responses/Problem' }
  /certificates/{id}/download:
    get:
      tags: [Certificates]
      operationId: downloadCertificate
      parameters: [{ $ref: '#/components/parameters/ID' }]
      responses:
        '200':
          description: PEM certificate chain
          content: { application/x-pem-file: { schema: { type: string } } }
  /certificates/{id}/private-key/download:
    post:
      tags: [Certificates]
      operationId: downloadOneTimePrivateKey
      parameters: [{ $ref: '#/components/parameters/ID' }]
      responses:
        '200':
          description: One-time PKCS#8 PEM private key owned by the caller
          content: { application/x-pem-file: { schema: { type: string } } }
        '410': { $ref: '#/components/responses/Problem' }
  /utilities/certinfo:
    post:
      tags: [Utilities]
      operationId: certificateInfo
      responses:
        '200': { description: Parsed certificate metadata }
        '422': { $ref: '#/components/responses/Problem' }
  /utilities/csr:
    post:
      tags: [Utilities]
      operationId: generateCSR
      responses:
        '200': { description: Generated CSR and uncached private key }
        '422': { $ref: '#/components/responses/Problem' }
  /utilities/bundle:
    post:
      tags: [Utilities]
      operationId: bundleCertificates
      responses:
        '200': { description: CFSSL optimized certificate bundle }
        '422': { $ref: '#/components/responses/Problem' }
  /audit-events:
    get:
      tags: [Audit]
      operationId: listAuditEvents
      parameters:
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 500, default: 100 } }
      responses:
        '200': { description: Append-only hash-chained audit records }
        '403': { $ref: '#/components/responses/Problem' }
  /metrics:
    get:
      tags: [Operations]
      operationId: prometheusMetrics
      responses:
        '200':
          description: Prometheus exposition format for operators and the super administrator
          content: { text/plain: { schema: { type: string } } }
  /health/live:
    get:
      tags: [Operations]
      operationId: live
      security: []
      responses: { '200': { description: Process is live } }
  /health/ready:
    get:
      tags: [Operations]
      operationId: ready
      security: []
      responses: { '200': { description: PostgreSQL is reachable } }
  /version:
    get:
      tags: [Operations]
      operationId: version
      security: []
      responses: { '200': { description: PKI-Console and upstream CFSSL versions } }
  /pki/v1/authorities:
    get:
      tags: [Public PKI]
      operationId: publicAuthorities
      security: []
      responses:
        '200': { description: Public CA certificates and chains }
  /pki/v1/certificates/by-fingerprint/{fingerprint}:
    get:
      tags: [Public PKI]
      operationId: publicCertificateByFingerprint
      security: []
      parameters:
        - name: fingerprint
          in: path
          required: true
          schema: { type: string, pattern: '^[A-Fa-f0-9:]{64,95}$' }
      responses:
        '200':
          description: Exact certificate match
          content: { application/json: { schema: { $ref: '#/components/schemas/Certificate' } } }
        '404': { $ref: '#/components/responses/Problem' }
  /pki/v1/certificates/by-issuer/{issuer}/serial/{serial}:
    get:
      tags: [Public PKI]
      operationId: publicCertificateByIssuerSerial
      security: []
      parameters:
        - { name: issuer, in: path, required: true, schema: { type: string } }
        - { name: serial, in: path, required: true, schema: { type: string, pattern: '^[0-9]+$' } }
      responses:
        '200': { description: Exact certificate match }
        '404': { $ref: '#/components/responses/Problem' }
  /pki/v1/status/{issuer}/{serial}:
    get:
      tags: [Public PKI]
      operationId: publicCertificateStatus
      security: []
      parameters:
        - { name: issuer, in: path, required: true, schema: { type: string } }
        - { name: serial, in: path, required: true, schema: { type: string, pattern: '^[0-9]+$' } }
      responses:
        '200': { description: Certificate good, revoked, or expired state }
        '404': { $ref: '#/components/responses/Problem' }
  /issuers/{slug}.cer:
    get:
      tags: [Public PKI]
      operationId: getIssuerCertificate
      security: []
      parameters:
        - { name: slug, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: DER encoded issuer certificate
          content: { application/pkix-cert: { schema: { type: string, contentEncoding: binary } } }
  /crl/{slug}.crl:
    get:
      tags: [Public PKI]
      operationId: getCRL
      security: []
      parameters:
        - name: slug
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: DER encoded X.509 CRL
          content: { application/pkix-crl: { schema: { type: string, contentEncoding: binary } } }
  /ocsp/{slug}:
    post:
      tags: [Public PKI]
      operationId: postOCSP
      security: []
      parameters:
        - name: slug
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content: { application/ocsp-request: { schema: { type: string, contentEncoding: binary } } }
      responses:
        '200':
          description: DER encoded OCSP response, including protocol-level error responses.
          content: { application/ocsp-response: { schema: { type: string, contentEncoding: binary } } }
  /ocsp/{slug}/{request}:
    get:
      tags: [Public PKI]
      operationId: getOCSP
      security: []
      parameters:
        - { name: slug, in: path, required: true, schema: { type: string } }
        - { name: request, in: path, required: true, schema: { type: string, description: Base64 encoded DER OCSP request } }
      responses:
        '200':
          description: DER encoded OCSP response
          content: { application/ocsp-response: { schema: { type: string, contentEncoding: binary } } }
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: __Host-pki_session
    csrfToken:
      type: apiKey
      in: header
      name: X-CSRF-Token
  parameters:
    ID:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    CFAccessEmail:
      name: Cf-Access-Authenticated-User-Email
      in: header
      required: false
      schema: { type: string, format: email }
    CFAccessJWT:
      name: Cf-Access-Jwt-Assertion
      in: header
      required: false
      schema: { type: string }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: 8-128 character key retained for 24 hours; reuse with different content returns 409.
      schema: { type: string, minLength: 8, maxLength: 128 }
  responses:
    Problem:
      description: RFC 9457 problem detail
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
  requestBodies:
    CreateCA:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [name, slug, subject, path_length]
            properties:
              name: { type: string }
              slug: { type: string, pattern: '^[a-z0-9][a-z0-9-]{1,62}$' }
              parent_ca_id: { type: string, format: uuid }
              path_length: { type: integer, minimum: 0, maximum: 5 }
              subject: { $ref: '#/components/schemas/Subject' }
    Decision:
      required: true
      content:
        application/json:
          schema:
            type: object
            properties:
              comment: { type: string, maxLength: 2000 }
    SigningProfile:
      required: true
      content:
        application/json:
          schema: { $ref: '#/components/schemas/SigningProfile' }
  schemas:
    Problem:
      type: object
      required: [type, title, status, detail, code]
      properties:
        type: { type: string, format: uri }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        code: { type: string }
    LoginRequest:
      type: object
      required: [login, password]
      properties:
        login: { type: string }
        password: { type: string, writeOnly: true }
        totp: { type: string, pattern: '^[0-9]{6}$', writeOnly: true }
    LoginResponse:
      type: object
      required: [user, csrf_token, expires_at]
      properties:
        user: { $ref: '#/components/schemas/User' }
        csrf_token: { type: string, writeOnly: true }
        expires_at: { type: string, format: date-time }
    User:
      type: object
      required: [id, username, role, status]
      properties:
        id: { type: string, format: uuid }
        username: { type: string }
        email: { type: [string, 'null'], format: email }
        role: { type: string, enum: [super_admin, operator, user] }
        status: { type: string, enum: [active, disabled, locked] }
    Subject:
      type: object
      required: [common_name]
      properties:
        common_name: { type: string }
        country: { type: string }
        province: { type: string }
        locality: { type: string }
        organization: { type: string }
        organizational_unit: { type: string }
    CertificateAuthority:
      type: object
      required: [id, slug, name, kind, status, certificate_pem, chain_pem, not_before, not_after]
      properties:
        id: { type: string, format: uuid }
        parent_ca_id: { type: [string, 'null'], format: uuid }
        slug: { type: string }
        name: { type: string }
        kind: { type: string, enum: [root, intermediate] }
        status: { type: string }
        subject: { $ref: '#/components/schemas/Subject' }
        certificate_pem: { type: string }
        chain_pem: { type: string }
        not_before: { type: string, format: date-time }
        not_after: { type: string, format: date-time }
    SigningProfile:
      type: object
      required: [name, default_validity_seconds, max_validity_seconds, key_usages, enabled]
      properties:
        id: { type: string, format: uuid, readOnly: true }
        ca_id: { type: string, format: uuid, readOnly: true }
        name: { type: string, minLength: 1, maxLength: 128 }
        description: { type: string }
        default_validity_seconds: { type: integer, minimum: 1, maximum: 34300800 }
        max_validity_seconds: { type: integer, minimum: 1, maximum: 34300800 }
        key_usages: { type: array, minItems: 1, items: { type: string } }
        extended_key_usages: { type: array, items: { type: string } }
        allowed_dns_patterns: { type: array, items: { type: string, description: Go glob pattern } }
        allowed_ip_ranges: { type: array, items: { type: string, description: IPv4 or IPv6 CIDR } }
        allow_email_sans: { type: boolean, default: false }
        allow_uri_sans: { type: boolean, default: false }
        policy: { type: object, additionalProperties: true }
        enabled: { type: boolean }
    CreateCertificateRequest:
      type: object
      required: [ca_id]
      properties:
        ca_id: { type: string, format: uuid }
        profile_id: { type: string, format: uuid }
        csr_pem: { type: string }
        subject: { $ref: '#/components/schemas/Subject' }
        sans: { type: array, items: { type: string } }
