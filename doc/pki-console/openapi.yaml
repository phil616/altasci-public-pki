openapi: 3.1.0
info:
  title: PKI-Console API
  version: 0.1.0
  description: |
    Authenticated enterprise PKI management and public certificate-status APIs.
    Clients establish a local session with /auth/login using their username/email
    and password. Super administrators also provide an RFC 6238 SHA-256 TOTP code.
    Subsequent requests use the HttpOnly session cookie; unsafe requests also
    require the X-CSRF-Token returned at login. No external identity service is required.

    Contract verified against source on 2026-11-15; domains are examples. The info.version
    identifies this API contract, not the deployed binary version from /version. JSON input
    rejects unknown fields and is limited to 1 MiB. Byte limits in the implementation
    apply to UTF-8 data, including passwords and idempotency keys. Lists may contain
    items: null where documented when no records exist. Production serves distinct
    Console and public hostnames; unconfigured Host returns 421. Console requests
    with an incompatible Origin return 403. Only documented idempotent operations
    accept an optional Idempotency-Key. Response schemas describe current fields,
    not a guarantee of redaction of public certificate metadata.
servers:
  - {url: 'https://pki-console.example.com/api/v1', description: Console API}
tags:
  - {name: Authentication}
  - {name: Users}
  - {name: Certificate Authorities}
  - {name: Certificate Requests}
  - {name: Certificates}
  - {name: Signing Profiles}
  - {name: Timestamping}
  - {name: Audit}
  - {name: Utilities}
  - {name: Operations}
  - {name: Public PKI}
paths:
  /auth/login:
    post:
      tags: [Authentication]
      operationId: login
      description: Establishes a local session. Super administrators must also supply a fresh SHA-256 TOTP code.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/LoginRequest'}
      responses:
        '200':
          description: Authenticated. The response also sets the secure session cookie.
          headers:
            Set-Cookie:
              description: Host-only HttpOnly PKI-Console session cookie. Retain it in the client's cookie jar.
              schema: {type: string}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/LoginResponse'}
        '401': {$ref: '#/components/responses/Problem'}
        '400': {$ref: '#/components/responses/Problem'}
        '500': {$ref: '#/components/responses/Problem'}
        '429': {$ref: '#/components/responses/Problem'}
        '503': {$ref: '#/components/responses/Problem'}
  /auth/logout:
    post:
      tags: [Authentication]
      operationId: logout
      security:
        - sessionCookie: []
          csrfToken: []
      responses:
        '204': {description: Session revoked}
        '401': {$ref: '#/components/responses/Problem'}
        '400': {$ref: '#/components/responses/Problem'}
        '500': {$ref: '#/components/responses/Problem'}
        '503': {$ref: '#/components/responses/Problem'}
  /auth/session:
    get:
      tags: [Authentication]
      operationId: currentSession
      responses:
        '200':
          description: Current authenticated user
          content:
            application/json:
              schema:
                type: object
                required: [user]
                properties:
                  user: {$ref: '#/components/schemas/User'}
        '401': {$ref: '#/components/responses/Problem'}
        '500': {$ref: '#/components/responses/Problem'}
  /users:
    get:
      tags: [Users]
      operationId: listUsers
      responses:
        '200':
          description: Records visible to caller
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: [array, 'null']
                    items: {$ref: '#/components/schemas/User'}
                required: [items]
        '403': {$ref: '#/components/responses/Problem'}
        '500': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
    post:
      security:
        - sessionCookie: []
          csrfToken: []
      tags: [Users]
      operationId: createUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, role, password]
              properties:
                username: {type: string, minLength: 3, maxLength: 128, description: 3–128 UTF-8 bytes after trimming.}
                email:
                  type: [string, 'null']
                  format: email
                role:
                  type: string
                  enum: [operator, user]
                password:
                  type: string
                  minLength: 15
                  maxLength: 128
                  writeOnly: true
                  description: 15–128 UTF-8 bytes.
              additionalProperties: false
      responses:
        '201':
          description: User created
          content:
            application/json:
              schema: {$ref: '#/components/schemas/User'}
        '403': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
        '413': {$ref: '#/components/responses/Problem'}
        '400': {$ref: '#/components/responses/Problem'}
        '500': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
        '503': {$ref: '#/components/responses/Problem'}
        '429': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/Problem'}
      parameters:
        - {$ref: '#/components/parameters/IdempotencyKey'}
  /users/{id}/status:
    patch:
      security:
        - sessionCookie: []
          csrfToken: []
      tags: [Users]
      operationId: setUserStatus
      parameters:
        - {$ref: '#/components/parameters/ID'}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status:
                  type: string
                  enum: [active, disabled]
              additionalProperties: false
      responses:
        '204': {description: User status updated; disabling revokes active sessions}
        '403': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
        '413': {$ref: '#/components/responses/Problem'}
        '400': {$ref: '#/components/responses/Problem'}
        '500': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
        '503': {$ref: '#/components/responses/Problem'}
        '429': {$ref: '#/components/responses/Problem'}
  /users/{id}/password:
    put:
      security:
        - sessionCookie: []
          csrfToken: []
      tags: [Users]
      operationId: resetUserPassword
      parameters:
        - {$ref: '#/components/parameters/ID'}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password]
              properties:
                password:
                  type: string
                  minLength: 15
                  maxLength: 128
                  writeOnly: true
                  description: 15–128 UTF-8 bytes.
              additionalProperties: false
      responses:
        '204': {description: Password replaced and all existing sessions revoked}
        '404': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
        '413': {$ref: '#/components/responses/Problem'}
        '400': {$ref: '#/components/responses/Problem'}
        '500': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
        '503': {$ref: '#/components/responses/Problem'}
        '429': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/Problem'}
  /cas:
    get:
      tags: [Certificate Authorities]
      operationId: listCAs
      responses:
        '200':
          description: Certificate authorities
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: {$ref: '#/components/schemas/CertificateAuthority'}
        '500': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
  /cas/roots:
    post:
      security:
        - sessionCookie: []
          csrfToken: []
      tags: [Certificate Authorities]
      operationId: createRootCA
      requestBody: {$ref: '#/components/requestBodies/CreateCA'}
      responses:
        '201':
          description: Root CA created
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CertificateAuthority'}
        '422': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
        '413': {$ref: '#/components/responses/Problem'}
        '400': {$ref: '#/components/responses/Problem'}
        '500': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
        '503': {$ref: '#/components/responses/Problem'}
        '429': {$ref: '#/components/responses/Problem'}
      parameters:
        - {$ref: '#/components/parameters/IdempotencyKey'}
      description: Super administrator only. Current service validation failures, including insufficient role, return
        422.
  /cas/intermediates:
    post:
      security:
        - sessionCookie: []
          csrfToken: []
      tags: [Certificate Authorities]
      operationId: createIntermediateCA
      requestBody: {$ref: '#/components/requestBodies/CreateCA'}
      responses:
        '201':
          description: Intermediate CA created
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CertificateAuthority'}
        '422': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
        '413': {$ref: '#/components/responses/Problem'}
        '400': {$ref: '#/components/responses/Problem'}
        '500': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
        '503': {$ref: '#/components/responses/Problem'}
        '429': {$ref: '#/components/responses/Problem'}
      parameters:
        - {$ref: '#/components/parameters/IdempotencyKey'}
      description: Super administrator only. Current service validation failures, including insufficient role, return
        422.
  /cas/import:
    post:
      security:
        - sessionCookie: []
          csrfToken: []
      tags: [Certificate Authorities]
      operationId: importCA
      description: |
        Super administrator only. Imports an existing CA certificate and matching
        unencrypted PEM private key. Root CAs must be self-signed. Intermediate
        CAs require an existing active parent and a valid complete chain. The
        certificate, subject, validity and path constraints are preserved; a
        default signing profile and encrypted delegated OCSP responder are created.
        Historical issuance and revocation records are not imported.
      parameters:
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ImportCA'}
      responses:
        '201':
          description: CA imported; response never includes private key material
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CertificateAuthority'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/Problem'}
        '413': {$ref: '#/components/responses/Problem'}
        '400': {$ref: '#/components/responses/Problem'}
        '500': {$ref: '#/components/responses/Problem'}
        '503': {$ref: '#/components/responses/Problem'}
        '429': {$ref: '#/components/responses/Problem'}
  /cas/{id}:
    get:
      tags: [Certificate Authorities]
      operationId: getCA
      parameters:
        - {$ref: '#/components/parameters/ID'}
      responses:
        '200':
          description: Certificate authority
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CertificateAuthority'}
        '404': {$ref: '#/components/responses/Problem'}
        '500': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
  /cas/{id}/grants:
    get:
      tags: [Certificate Authorities]
      operationId: listCAGrants
      parameters:
        - {$ref: '#/components/parameters/ID'}
      responses:
        '200':
          description: Records visible to caller
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: [array, 'null']
                    items: {$ref: '#/components/schemas/CAGrant'}
                required: [items]
        '403': {$ref: '#/components/responses/Problem'}
        '500': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
    post:
      security:
        - sessionCookie: []
          csrfToken: []
      tags: [Certificate Authorities]
      operationId: createCAGrant
      parameters:
        - {$ref: '#/components/parameters/ID'}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [user_id, permission]
              properties:
                user_id: {type: string, format: uuid}
                permission:
                  type: string
                  enum: [view_requests, approve, issue, revoke]
              additionalProperties: false
      responses:
        '204': {description: Grant created}
        '422': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
        '413': {$ref: '#/components/responses/Problem'}
        '400': {$ref: '#/components/responses/Problem'}
        '500': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
        '503': {$ref: '#/components/responses/Problem'}
        '429': {$ref: '#/components/responses/Problem'}
  /cas/{id}/grants/{userID}/{permission}:
    delete:
      security:
        - sessionCookie: []
          csrfToken: []
      tags: [Certificate Authorities]
      operationId: deleteCAGrant
      parameters:
        - {$ref: '#/components/parameters/ID'}
        - name: userID
          in: path
          required: true
          schema: {type: string, format: uuid}
        - name: permission
          in: path
          required: true
          schema: {type: string}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      responses:
        '204': {description: Grant revoked}
        '404': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
        '413': {$ref: '#/components/responses/Problem'}
        '400': {$ref: '#/components/responses/Problem'}
        '500': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
        '503': {$ref: '#/components/responses/Problem'}
        '429': {$ref: '#/components/responses/Problem'}
  /cas/{id}/profiles:
    get:
      tags: [Signing Profiles]
      operationId: listSigningProfiles
      parameters:
        - {$ref: '#/components/parameters/ID'}
      responses:
        '200':
          description: Signing profiles
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: {$ref: '#/components/schemas/SigningProfile'}
        '500': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
    post:
      security:
        - sessionCookie: []
          csrfToken: []
      tags: [Signing Profiles]
      operationId: createSigningProfile
      parameters:
        - {$ref: '#/components/parameters/ID'}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody: {$ref: '#/components/requestBodies/SigningProfile'}
      responses:
        '201':
          description: Signing profile created
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SigningProfile'}
        '422': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
        '413': {$ref: '#/components/responses/Problem'}
        '400': {$ref: '#/components/responses/Problem'}
        '500': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
        '503': {$ref: '#/components/responses/Problem'}
        '429': {$ref: '#/components/responses/Problem'}
  /cas/{id}/profiles/{profileID}:
    put:
      security:
        - sessionCookie: []
          csrfToken: []
      tags: [Signing Profiles]
      operationId: updateSigningProfile
      parameters:
        - {$ref: '#/components/parameters/ID'}
        - name: profileID
          in: path
          required: true
          schema: {type: string, format: uuid}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody: {$ref: '#/components/requestBodies/SigningProfile'}
      responses:
        '200':
          description: Signing profile updated
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SigningProfile'}
        '409': {$ref: '#/components/responses/Problem'}
        '413': {$ref: '#/components/responses/Problem'}
        '400': {$ref: '#/components/responses/Problem'}
        '500': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
        '503': {$ref: '#/components/responses/Problem'}
        '429': {$ref: '#/components/responses/Problem'}
    delete:
      security:
        - sessionCookie: []
          csrfToken: []
      tags: [Signing Profiles]
      operationId: deleteSigningProfile
      parameters:
        - {$ref: '#/components/parameters/ID'}
        - name: profileID
          in: path
          required: true
          schema: {type: string, format: uuid}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      responses:
        '204': {description: Non-default unreferenced profile deleted}
        '409': {$ref: '#/components/responses/Problem'}
        '413': {$ref: '#/components/responses/Problem'}
        '400': {$ref: '#/components/responses/Problem'}
        '500': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
        '503': {$ref: '#/components/responses/Problem'}
        '429': {$ref: '#/components/responses/Problem'}
  /cas/{id}/keys/export:
    post:
      security:
        - sessionCookie: []
          csrfToken: []
      tags: [Certificate Authorities]
      operationId: exportCAKey
      parameters:
        - {$ref: '#/components/parameters/ID'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password, totp]
              properties:
                password: {type: string, writeOnly: true}
                totp: {type: string, pattern: '^[0-9]{6}$', writeOnly: true}
              additionalProperties: false
      responses:
        '200':
          description: PKCS#8 PEM private key; never cache this response.
          headers:
            Cache-Control:
              schema: {type: string, const: 'no-store, max-age=0'}
          content:
            application/x-pem-file:
              schema: {type: string}
        '403': {$ref: '#/components/responses/Problem'}
        '400': {$ref: '#/components/responses/Problem'}
        '500': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
        '503': {$ref: '#/components/responses/Problem'}
        '429': {$ref: '#/components/responses/Problem'}
      description: Super administrator re-enters the current password and a fresh unused TOTP. Not idempotent. Step-up
        failure or its per-user rate limit returns 403.
  /cas/{id}/timestamp-authorities:
    get:
      tags: [Timestamping]
      operationId: listTimestampAuthorities
      parameters:
        - {$ref: '#/components/parameters/ID'}
      responses:
        '200':
          description: Timestamp authorities issued by this certificate authority.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: {$ref: '#/components/schemas/TimestampAuthority'}
        '401': {$ref: '#/components/responses/Problem'}
        '500': {$ref: '#/components/responses/Problem'}
    post:
      security:
        - sessionCookie: []
          csrfToken: []
      tags: [Timestamping]
      operationId: createTimestampAuthority
      parameters:
        - {$ref: '#/components/parameters/ID'}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateTimestampAuthority'}
      responses:
        '201':
          description: Timestamp authority created.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TimestampAuthority'}
        '422': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
        '413': {$ref: '#/components/responses/Problem'}
        '400': {$ref: '#/components/responses/Problem'}
        '500': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
        '503': {$ref: '#/components/responses/Problem'}
        '429': {$ref: '#/components/responses/Problem'}
      description: Super administrator only; service validation and role failures return 422.
  /certificate-requests:
    get:
      tags: [Certificate Requests]
      operationId: listCertificateRequests
      responses:
        '200':
          description: Records visible to caller
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: [array, 'null']
                    items: {$ref: '#/components/schemas/CertificateRequest'}
                required: [items]
        '500': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
    post:
      security:
        - sessionCookie: []
          csrfToken: []
      tags: [Certificate Requests]
      operationId: createCertificateRequest
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateCertificateRequest'}
      responses:
        '201':
          description: Request submitted
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CertificateRequest'}
        '422': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
        '413': {$ref: '#/components/responses/Problem'}
        '400': {$ref: '#/components/responses/Problem'}
        '500': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
        '503': {$ref: '#/components/responses/Problem'}
        '429': {$ref: '#/components/responses/Problem'}
      parameters:
        - {$ref: '#/components/parameters/IdempotencyKey'}
  /certificate-requests/{id}/approve:
    post:
      security:
        - sessionCookie: []
          csrfToken: []
      tags: [Certificate Requests]
      operationId: approveCertificateRequest
      parameters:
        - {$ref: '#/components/parameters/ID'}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody: {$ref: '#/components/requestBodies/Decision'}
      responses:
        '202':
          description: Decision recorded; approval queues background issuance
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: {type: string, format: uuid}
                  status: {type: string, const: approved}
                required: [id, status]
        '409': {$ref: '#/components/responses/Problem'}
        '413': {$ref: '#/components/responses/Problem'}
        '400': {$ref: '#/components/responses/Problem'}
        '500': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
        '503': {$ref: '#/components/responses/Problem'}
        '429': {$ref: '#/components/responses/Problem'}
  /certificate-requests/{id}:
    get:
      tags: [Certificate Requests]
      operationId: getCertificateRequest
      parameters:
        - {$ref: '#/components/parameters/ID'}
      responses:
        '200':
          description: Certificate request visible to the caller
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CertificateRequest'}
        '404': {$ref: '#/components/responses/Problem'}
        '500': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
  /certificate-requests/{id}/reject:
    post:
      security:
        - sessionCookie: []
          csrfToken: []
      tags: [Certificate Requests]
      operationId: rejectCertificateRequest
      parameters:
        - {$ref: '#/components/parameters/ID'}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody: {$ref: '#/components/requestBodies/Decision'}
      responses:
        '202':
          description: Decision recorded; approval queues background issuance
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: {type: string, format: uuid}
                  status: {type: string, const: rejected}
                required: [id, status]
        '409': {$ref: '#/components/responses/Problem'}
        '413': {$ref: '#/components/responses/Problem'}
        '400': {$ref: '#/components/responses/Problem'}
        '500': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
        '503': {$ref: '#/components/responses/Problem'}
        '429': {$ref: '#/components/responses/Problem'}
  /certificate-inventory:
    get:
      tags: [Certificates]
      operationId: listCertificateInventory
      description: Lists certificate requests together with their resulting certificates. Super administrators see
        the entire system; operators see their own requests, decisions, and authorized CA records; ordinary users
        see only their own records.
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [pending, issued, rejected, failed]
          description: Workflow group. Pending includes pending, approved, and issuing requests.
      responses:
        '200':
          description: Role-filtered certificate inventory
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: [array, 'null']
                    items: {$ref: '#/components/schemas/CertificateInventoryItem'}
        '400': {$ref: '#/components/responses/Problem'}
        '500': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
  /certificates:
    get:
      tags: [Certificates]
      operationId: listCertificates
      responses:
        '200':
          description: Records visible to caller
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: [array, 'null']
                    items: {$ref: '#/components/schemas/CertificateSummary'}
                required: [items]
        '500': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
  /certificates/{id}/revoke:
    post:
      security:
        - sessionCookie: []
          csrfToken: []
      tags: [Certificates]
      operationId: revokeCertificate
      parameters:
        - {$ref: '#/components/parameters/ID'}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                reason:
                  type: integer
                  default: 0
                  minimum: 0
                  maximum: 10
                  not: {const: 7}
                comment: {type: string}
              additionalProperties: false
      responses:
        '200':
          description: Certificate revoked and CRL regenerated
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Certificate'}
        '422': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
        '413': {$ref: '#/components/responses/Problem'}
        '400': {$ref: '#/components/responses/Problem'}
        '500': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
        '503': {$ref: '#/components/responses/Problem'}
        '429': {$ref: '#/components/responses/Problem'}
  /certificates/{id}:
    get:
      tags: [Certificates]
      operationId: getCertificate
      parameters:
        - {$ref: '#/components/parameters/ID'}
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Certificate'}
        '404': {$ref: '#/components/responses/Problem'}
        '500': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
  /certificates/{id}/download:
    get:
      tags: [Certificates]
      operationId: downloadCertificate
      parameters:
        - {$ref: '#/components/parameters/ID'}
      responses:
        '200':
          description: PEM certificate chain
          content:
            application/x-pem-file:
              schema: {type: string}
        '500': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
  /certificates/{id}/private-key/download:
    post:
      security:
        - sessionCookie: []
          csrfToken: []
      tags: [Certificates]
      operationId: downloadOneTimePrivateKey
      parameters:
        - {$ref: '#/components/parameters/ID'}
      responses:
        '200':
          description: One-time PKCS#8 PEM private key owned by the caller
          content:
            application/x-pem-file:
              schema: {type: string}
        '410': {$ref: '#/components/responses/Problem'}
        '400': {$ref: '#/components/responses/Problem'}
        '500': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
        '503': {$ref: '#/components/responses/Problem'}
        '429': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
      description: Only the certificate owner may claim a server-generated private key within 24 hours. The stored
        artifact is erased before sending the response; transport failure does not allow retry. No idempotency support.
  /utilities/certinfo:
    post:
      security:
        - sessionCookie: []
          csrfToken: []
      tags: [Utilities]
      operationId: certificateInfo
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CertificateInfo'}
        '422': {$ref: '#/components/responses/Problem'}
        '400': {$ref: '#/components/responses/Problem'}
        '500': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
        '503': {$ref: '#/components/responses/Problem'}
        '429': {$ref: '#/components/responses/Problem'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CertificateInfoInput'}
  /utilities/csr:
    post:
      security:
        - sessionCookie: []
          csrfToken: []
      tags: [Utilities]
      operationId: generateCSR
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  csr_pem: {type: string}
                  private_key_pem: {type: string, description: Returned once in this response; not saved for later
                      download.}
                required: [csr_pem, private_key_pem]
        '422': {$ref: '#/components/responses/Problem'}
        '400': {$ref: '#/components/responses/Problem'}
        '500': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
        '503': {$ref: '#/components/responses/Problem'}
        '429': {$ref: '#/components/responses/Problem'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/GenerateCSRInput'}
  /utilities/bundle:
    post:
      security:
        - sessionCookie: []
          csrfToken: []
      tags: [Utilities]
      operationId: bundleCertificates
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Bundle'}
        '422': {$ref: '#/components/responses/Problem'}
        '400': {$ref: '#/components/responses/Problem'}
        '500': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
        '503': {$ref: '#/components/responses/Problem'}
        '429': {$ref: '#/components/responses/Problem'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/BundleInput'}
      description: Builds a CFSSL bundle from submitted certificates, roots and intermediates. AIA network fetching
        is disabled; provide missing intermediates explicitly. Omitted roots use the system trust store.
  /audit-events:
    get:
      tags: [Audit]
      operationId: listAuditEvents
      parameters:
        - name: limit
