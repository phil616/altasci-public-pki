      responses:
        '200':
          description: Records visible to caller
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: [array, 'null']
                    items: {$ref: '#/components/schemas/AuditRecord'}
                required: [items]
        '403': {$ref: '#/components/responses/Problem'}
        '500': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
  /metrics:
    get:
      tags: [Operations]
      operationId: prometheusMetrics
      responses:
        '200':
          description: Prometheus exposition format for operators and the super administrator
          content:
            text/plain:
              schema: {type: string}
        '500': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
  /health/live:
    get:
      tags: [Operations]
      operationId: live
      security: []
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: {type: string, const: ok}
                required: [status]
        '500': {$ref: '#/components/responses/Problem'}
      servers:
        - {url: 'https://pki-console.example.com/api/v1', description: Console liveness}
        - {url: 'https://pki.example.com', description: Public liveness}
  /health/ready:
    get:
      tags: [Operations]
      operationId: ready
      security: []
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: {type: string, const: ready}
                required: [status]
        '500': {$ref: '#/components/responses/Problem'}
        '503': {$ref: '#/components/responses/Problem'}
  /version:
    get:
      tags: [Operations]
      operationId: version
      security: []
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  name: {type: string, const: PKI-Console}
                  version: {type: string}
                  cfssl_upstream: {type: string}
                required: [name, version, cfssl_upstream]
        '500': {$ref: '#/components/responses/Problem'}
  /pki/v1/authorities:
    servers:
      - {url: 'https://pki.example.com', description: Public PKI publication service}
    get:
      tags: [Public PKI]
      operationId: publicAuthorities
      security: []
      responses:
        '200':
          description: Records visible to caller
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: {$ref: '#/components/schemas/CertificateAuthority'}
                required: [items]
  /pki/v1/certificates/by-fingerprint/{fingerprint}:
    servers:
      - {url: 'https://pki.example.com', description: Public PKI publication service}
    get:
      tags: [Public PKI]
      operationId: publicCertificateByFingerprint
      security: []
      parameters:
        - name: fingerprint
          in: path
          required: true
          schema: {type: string, pattern: '^[A-Fa-f0-9:]{64,95}$'}
      responses:
        '200':
          description: Exact certificate match
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Certificate'}
        '404': {$ref: '#/components/responses/Problem'}
        '400': {$ref: '#/components/responses/Problem'}
  /pki/v1/certificates/by-issuer/{issuer}/serial/{serial}:
    servers:
      - {url: 'https://pki.example.com', description: Public PKI publication service}
    get:
      tags: [Public PKI]
      operationId: publicCertificateByIssuerSerial
      security: []
      parameters:
        - name: issuer
          in: path
          required: true
          schema: {type: string}
          description: Issuer CA slug, not UUID or distinguished name.
        - name: serial
          in: path
          required: true
          schema: {type: string, pattern: '^[0-9]+$'}
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Certificate'}
        '404': {$ref: '#/components/responses/Problem'}
  /pki/v1/status/{issuer}/{serial}:
    servers:
      - {url: 'https://pki.example.com', description: Public PKI publication service}
    get:
      tags: [Public PKI]
      operationId: publicCertificateStatus
      security: []
      parameters:
        - name: issuer
          in: path
          required: true
          schema: {type: string}
          description: Issuer CA slug, not UUID or distinguished name.
        - name: serial
          in: path
          required: true
          schema: {type: string, pattern: '^[0-9]+$'}
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  issuer: {type: string}
                  serial: {type: string}
                  status:
                    type: string
                    enum: [good, revoked, expired]
                  not_before: {type: string, format: date-time}
                  not_after: {type: string, format: date-time}
                required: [issuer, serial, status, not_before, not_after]
        '404': {$ref: '#/components/responses/Problem'}
  /issuers/{slug}.cer:
    servers:
      - {url: 'https://pki.example.com', description: Public PKI publication service}
    get:
      tags: [Public PKI]
      operationId: getIssuerCertificate
      security: []
      parameters:
        - name: slug
          in: path
          required: true
          schema: {type: string}
      responses:
        '200':
          description: DER encoded issuer certificate
          content:
            application/pkix-cert: {}
        '404': {$ref: '#/components/responses/Problem'}
  /crl/{slug}.crl:
    servers:
      - {url: 'https://pki.example.com', description: Public PKI publication service}
    get:
      tags: [Public PKI]
      operationId: getCRL
      security: []
      parameters:
        - name: slug
          in: path
          required: true
          schema: {type: string}
      responses:
        '200':
          description: DER encoded X.509 CRL
          content:
            application/pkix-crl: {}
        '429': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '503': {$ref: '#/components/responses/Problem'}
  /ocsp/{slug}:
    servers:
      - {url: 'https://pki.example.com', description: Public PKI publication service}
    post:
      tags: [Public PKI]
      operationId: postOCSP
      security: []
      parameters:
        - name: slug
          in: path
          required: true
          schema: {type: string}
      requestBody:
        required: true
        content:
          application/ocsp-request: {}
      responses:
        '200':
          description: DER encoded OCSP response, including protocol-level error responses.
          content:
            application/ocsp-response: {}
        '429': {$ref: '#/components/responses/Problem'}
  /ocsp/{slug}/{request}:
    servers:
      - {url: 'https://pki.example.com', description: Public PKI publication service}
    get:
      tags: [Public PKI]
      operationId: getOCSP
      security: []
      parameters:
        - name: slug
          in: path
          required: true
          schema: {type: string}
        - name: request
          in: path
          required: true
          schema: {type: string, description: Base64 encoded DER OCSP request}
      responses:
        '200':
          description: DER encoded OCSP response
          content:
            application/ocsp-response: {}
        '429': {$ref: '#/components/responses/Problem'}
  /tsa/{slug}:
    servers:
      - {url: 'https://pki.example.com', description: Public PKI publication service}
    post:
      tags: [Timestamping, Public PKI]
      operationId: createTimestamp
      security: []
      parameters:
        - name: slug
          in: path
          required: true
          schema: {type: string}
      requestBody:
        required: true
        content:
          application/timestamp-query: {}
      responses:
        '200':
          description: DER encoded RFC 3161 timestamp reply, including protocol-level rejection responses.
          headers:
            Cache-Control:
              schema: {type: string, const: no-store}
          content:
            application/timestamp-reply: {}
        '413': {$ref: '#/components/responses/Problem'}
        '415': {$ref: '#/components/responses/Problem'}
        '429': {$ref: '#/components/responses/Problem'}
        '400': {$ref: '#/components/responses/Problem'}
      description: TSA requests are limited to 64 KiB; SHA-256/384/512 only. HTTP 200 may contain a protocol rejection.
        HTTP-level errors return problem JSON. Production signing requires healthy Linux kernel NTP state.
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: __Host-pki_session
      description: Returned by /auth/login. Send this cookie on subsequent authenticated requests.
    csrfToken:
      type: apiKey
      in: header
      name: X-CSRF-Token
      description: Returned by /auth/login and required on authenticated methods other than GET, HEAD, and OPTIONS.
  parameters:
    ID:
      name: id
      in: path
      required: true
      schema: {type: string, format: uuid}
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: Optional 8–128 UTF-8 byte key retained for 24 hours, scoped to user and route. Same method/URL/body
        replays stored status/body; changed content returns 409. Responses >=500 are not cached.
      schema: {type: string, minLength: 8, maxLength: 128}
  responses:
    Problem:
      description: RFC 9457 problem detail
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
  requestBodies:
    CreateCA:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [name, slug, subject]
            properties:
              name: {type: string}
              slug: {type: string, pattern: '^[a-z0-9][a-z0-9-]{1,62}$'}
              parent_ca_id:
                type: string
                format: uuid
                description: Required for intermediate creation (active root CA); absent for roots.
              path_length: {type: integer, minimum: 0, maximum: 5, default: 0}
              subject: {$ref: '#/components/schemas/Subject'}
            additionalProperties: false
    Decision:
      required: true
      content:
        application/json:
          schema:
            type: object
            properties:
              comment: {type: string}
    SigningProfile:
      required: true
      content:
        application/json:
          schema: {$ref: '#/components/schemas/SigningProfileInput'}
  schemas:
    Problem:
      type: object
      required: [type, title, status, detail, code]
      properties:
        type: {type: string, format: uri}
        title: {type: string}
        status: {type: integer}
        detail: {type: string}
        code: {type: string}
    LoginRequest:
      type: object
      required: [login, password]
      properties:
        login: {type: string, description: 'Username or email, at most 254 UTF-8 bytes.'}
        password:
          type: string
          writeOnly: true
          description: At most 1024 UTF-8 bytes; super administrator additionally requires TOTP.
        totp: {type: string, pattern: '^[0-9]{6}$', writeOnly: true}
    LoginResponse:
      type: object
      required: [user, csrf_token, expires_at]
      properties:
        user: {$ref: '#/components/schemas/User'}
        csrf_token: {type: string}
        expires_at: {type: string, format: date-time}
    User:
      type: object
      required: [id, username, role, status]
      properties:
        id: {type: string, format: uuid}
        username: {type: string}
        email:
          type: [string, 'null']
          format: email
        role:
          type: string
          enum: [super_admin, operator, user]
        status:
          type: string
          enum: [active, disabled, locked]
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    Subject:
      type: object
      required: [common_name]
      properties:
        common_name:
          type: string
          description: Required and non-blank for CA creation and server-generated leaf requests; imported certificate
            subjects may contain an empty value.
        country: {type: string}
        province: {type: string}
        locality: {type: string}
        organization: {type: string}
        organizational_unit: {type: string}
    ImportCA:
      type: object
      additionalProperties: false
      required: [name, slug, kind, certificate_pem, private_key_pem]
      properties:
        name: {type: string, minLength: 1}
        slug: {type: string, pattern: '^[a-z0-9][a-z0-9-]{1,62}$'}
        kind:
          type: string
          enum: [root, intermediate]
        parent_ca_id:
          type: string
          format: uuid
          description: Required for intermediates; must identify the actual active signing parent, root or intermediate.
            Absent for roots.
        certificate_pem:
          type: string
          description: Exactly one currently valid CA certificate with SKI, keyCertSign and cRLSign.
        private_key_pem:
          type: string
          writeOnly: true
          description: Matching unencrypted PKCS#8, PKCS#1 or SEC1 private key; RSA-2048/3072/4096 or ECDSA-P256/P384.
    CertificateAuthority:
      type: object
      required: [id, slug, name, kind, status, certificate_pem, chain_pem, not_before, not_after]
      properties:
        id: {type: string, format: uuid}
        parent_ca_id:
          type: [string, 'null']
          format: uuid
        slug: {type: string}
        name: {type: string}
        kind:
          type: string
          enum: [root, intermediate]
        path_length: {type: integer, minimum: -1, description: Maximum subordinate CA depth; -1 means unconstrained.}
        status: {type: string}
        subject: {$ref: '#/components/schemas/Subject'}
        certificate_pem: {type: string}
        chain_pem: {type: string}
        not_before: {type: string, format: date-time}
        not_after: {type: string, format: date-time}
        serial: {type: string}
        crl_url: {type: string}
        ocsp_url: {type: string}
        issuer_url: {type: string}
        created_by: {type: string, format: uuid}
        created_at: {type: string, format: date-time}
    SigningProfile:
      type: object
      required: [name, default_validity_seconds, max_validity_seconds, key_usages, enabled]
      properties:
        id: {type: string, format: uuid, readOnly: true}
        ca_id: {type: string, format: uuid, readOnly: true}
        name: {type: string, minLength: 1, maxLength: 128}
        description: {type: string}
        default_validity_seconds: {type: integer, minimum: 1}
        max_validity_seconds: {type: integer, minimum: 1}
        key_usages:
          type: array
          minItems: 1
          items: {type: string}
        extended_key_usages:
          type: array
          items: {type: string}
        allowed_dns_patterns:
          type: array
          items: {type: string, description: Go glob pattern}
        allowed_ip_ranges:
          type: array
          items: {type: string, description: IPv4 or IPv6 CIDR}
        allow_email_sans: {type: boolean, default: false}
        allow_uri_sans: {type: boolean, default: false}
        policy: {description: 'Stored JSON metadata, possibly null.'}
        enabled: {type: boolean}
    CreateTimestampAuthority:
      type: object
      required: [slug, name, policy_oid]
      properties:
        slug: {type: string, pattern: '^[a-z0-9-]{2,63}$'}
        name: {type: string, description: 'Non-blank, at most 128 UTF-8 bytes after trimming.'}
        policy_oid:
          type: string
          pattern: ^[0-9]+(?:\.[0-9]+)+$
          description: Canonical dotted decimal OID, at most 128 bytes, from a branch controlled by the operator.
        validity_seconds: {type: integer, minimum: 86400, maximum: 94608000}
    TimestampAuthority:
      type: object
      required: [id, ca_id, slug, name, policy_oid, certificate_pem, chain_pem, allowed_hashes, not_before, not_after,
        status, created_by, created_at]
      properties:
        id: {type: string, format: uuid}
        ca_id: {type: string, format: uuid}
        slug: {type: string}
        name: {type: string}
        policy_oid: {type: string}
        certificate_pem: {type: string}
        chain_pem: {type: string}
        allowed_hashes:
          type: array
          items:
            type: string
            enum: [SHA-256, SHA-384, SHA-512]
        not_before: {type: string, format: date-time}
        not_after: {type: string, format: date-time}
        status:
          type: string
          enum: [active, suspended, retired, revoked]
        created_by: {type: string, format: uuid}
        created_at: {type: string, format: date-time}
    CreateCertificateRequest:
      type: object
      required: [ca_id]
      properties:
        ca_id: {type: string, format: uuid}
        profile_id: {type: string, format: uuid}
        csr_pem: {type: string}
        subject: {$ref: '#/components/schemas/Subject'}
        sans:
          type: array
          items: {type: string}
        server_generate_key: {type: boolean, default: false}
        requested_validity_seconds: {type: integer, minimum: 1}
      description: Use an active intermediate CA. Unless server_generate_key=true, supply a valid signed CSR. Server
        generation requires subject.common_name; requested validity cannot exceed the selected enabled profile.
        Client CSR determines its own subject and SANs.
    CertificateRequest:
      type: object
      required: [id, requester_id, ca_id, profile_id, key_generation_mode, status, submitted_at]
      properties:
        id: {type: string, format: uuid}
        requester_id: {type: string, format: uuid}
        ca_id: {type: string, format: uuid}
        profile_id: {type: string, format: uuid}
        key_generation_mode:
          type: string
          enum: [client_csr, server_generated]
        status:
          type: string
          enum: [pending, approved, issuing, issued, rejected, failed, cancelled]
        submitted_at: {type: string, format: date-time}
        csr_pem: {type: string}
        requested_subject: {$ref: '#/components/schemas/Subject'}
        requested_sans:
          type: [array, 'null']
          items: {type: string}
        requested_validity_seconds: {type: integer}
        rejection_reason: {type: string}
        error_code: {type: string}
        approved_at: {type: string, format: date-time}
        issued_at: {type: string, format: date-time}
