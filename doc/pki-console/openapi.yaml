        allow_uri_sans: {type: boolean, default: false}
        policy: {description: Any JSON value stored as metadata; null or omitted is allowed.}
        enabled: {type: boolean, default: false}
      additionalProperties: false
      description: Full replacement input. max_validity_seconds >= default_validity_seconds. Empty DNS/IP allow-lists
        impose no restriction. policy is stored JSON metadata, not an additional validation engine.
