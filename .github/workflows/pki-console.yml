name: PKI-Console

on:
  pull_request:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: pki-console-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

jobs:
  check:
    name: Lightweight checks
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GOFLAGS: -mod=vendor
      GOPROXY: 'off'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate release tag
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python3 .github/scripts/validate-release-tag.py "$RELEASE_TAG"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install declared npm version
        working-directory: web
        run: npm install --global "$(node -p 'require("./package.json").packageManager')"
      - name: Frontend tests and production build
        working-directory: web
        run: |
          npm ci --no-audit --no-fund
          npm test
          npm run build
      - name: Go application tests
        run: go test -p 1 ./console/... ./cmd/pki-console ./web
      - name: Python client tests
        run: python3 -B -m unittest discover -s scripts -p test_signing_client.py
      - name: Build Linux archives and checksum manifest
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: bash .github/scripts/build-release.sh "$RELEASE_TAG" "$RUNNER_TEMP/pki-console-release"
      - name: Preserve release packages
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pki-console-release
          path: ${{ runner.temp }}/pki-console-release/*
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: check
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: pki-console-release
          path: ${{ runner.temp }}/pki-console-release
          digest-mismatch: error
      - name: Upload to draft, verify assets, then publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          bash .github/scripts/publish-release.sh "$RUNNER_TEMP/pki-console-release" \
            "pki-console-${RELEASE_TAG}-linux-amd64.tar.gz" \
            "pki-console-${RELEASE_TAG}-linux-arm64.tar.gz"
