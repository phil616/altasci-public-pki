name: Release PKI-Console

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      GOFLAGS: -mod=vendor
      GOPROXY: "off"
      GOTOOLCHAIN: local
      GH_TOKEN: ${{ github.token }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_PAGES_PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT }}

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.16.0"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Test backend
        run: |
          go test ./console/... ./cmd/pki-console
          go vet ./console/... ./cmd/pki-console

      - name: Test and build frontend
        working-directory: web
        run: |
          npm ci --no-audit --no-fund
          npm run check

      - name: Build backend binaries
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          mkdir release
          for arch in amd64 arm64; do
            CGO_ENABLED=0 GOOS=linux GOARCH="$arch" \
              go build -trimpath -buildvcs=true \
              -ldflags "-s -w -X main.version=${GITHUB_REF_NAME}" \
              -o "release/pki-console_${version}_linux_${arch}" \
              ./cmd/pki-console
          done
          (cd release && sha256sum pki-console_* > SHA256SUMS)

      - name: Deploy frontend to Cloudflare Pages
        working-directory: web
        run: |
          npx --no-install wrangler pages deploy dist \
            --project-name="$CLOUDFLARE_PAGES_PROJECT" \
            --branch=main \
            --commit-hash="$GITHUB_SHA" \
            --commit-message="Release $GITHUB_REF_NAME" \
            --commit-dirty=true

      - name: Publish GitHub Release
        shell: bash
        run: |
          set -euo pipefail
          args=(
            release create "$GITHUB_REF_NAME"
            release/pki-console_* release/SHA256SUMS
            --verify-tag
            --generate-notes
            --title "$GITHUB_REF_NAME"
          )
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            args+=(--prerelease)
          fi
          gh "${args[@]}"
